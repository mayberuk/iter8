name: Feature request
description: Suggest something iter8 could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work, and any alternative you considered.
  - type: input
    id: agent
    attributes:
      label: Coding agent
      description: Which agent you use iter8 with, if it matters.
