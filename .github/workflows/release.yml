name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run setup:browsers --with-deps
      - run: bun run build
      - run: bun run check

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run release -- --tag "$TAG" --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          if-no-files-found: error
          path: |
            dist/release/iter8-linux-x64
            dist/release/iter8-darwin-arm64
            dist/release/SHA256SUMS

  macos:
    needs: build
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist/release
      - name: Verify macOS signature and version
        working-directory: dist/release
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          shasum -a 256 --check SHA256SUMS
          chmod +x iter8-darwin-arm64
          if codesign -vvv --verify ./iter8-darwin-arm64; then
            echo "macOS codesign: cross-compiled signature verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS codesign: cross-compiled signature failed; applying ad-hoc signature." >> "$GITHUB_STEP_SUMMARY"
            codesign --force --sign - --entitlements ../../scripts/entitlements.plist ./iter8-darwin-arm64
            codesign -vvv --verify ./iter8-darwin-arm64
            echo "macOS codesign: ad-hoc signature verified." >> "$GITHUB_STEP_SUMMARY"
          fi
          actual=$(./iter8-darwin-arm64 --version)
          expected="iter8 ${TAG#v}"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected '$expected', received '$actual'" >&2
            exit 1
          fi
          shasum -a 256 iter8-linux-x64 iter8-darwin-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          if-no-files-found: error
          path: |
            dist/release/iter8-linux-x64
            dist/release/iter8-darwin-arm64
            dist/release/SHA256SUMS

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: mayberuk/iter8
      TAG: ${{ github.ref_name }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist/release
      - name: Publish release
        working-directory: dist/release
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag iter8-linux-x64 iter8-darwin-arm64 SHA256SUMS

  pin-plugin:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # A job-level `if` cannot read secrets, so the gate step turns the token's presence into an output.
      - name: Check for cc-plugins token
        id: gate
        env:
          TOKEN: ${{ secrets.CC_PLUGINS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CC_PLUGINS_TOKEN is not set; skipping the cc-plugins pin bump"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          repository: mayberuk/cc-plugins
          token: ${{ secrets.CC_PLUGINS_TOKEN }}
          path: cc-plugins
      - name: Decide whether to pin
        id: decide
        if: steps.gate.outputs.enabled == 'true'
        working-directory: cc-plugins
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease; skipping the cc-plugins pin bump"
            echo "pin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(jq -er .version plugins/iter8/release.json)
          IFS=. read -ra NEW <<< "${VERSION%%+*}"
          IFS=. read -ra OLD <<< "${CURRENT%%[-+]*}"
          PIN=false
          for i in 0 1 2; do
            if (( 10#${NEW[i]} > 10#${OLD[i]} )); then PIN=true; break; fi
            if (( 10#${NEW[i]} < 10#${OLD[i]} )); then break; fi
          done
          if [ "$PIN" = false ]; then
            echo "::notice::$VERSION is not newer than the pinned $CURRENT; skipping the cc-plugins pin bump"
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
      - name: Pin release checksums
        if: steps.gate.outputs.enabled == 'true' && steps.decide.outputs.pin == 'true'
        working-directory: cc-plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git switch -c "iter8-pin-$VERSION"
          plugins/iter8/scripts/pin-release.sh "$VERSION"
      - name: Open the pin pull request
        if: steps.gate.outputs.enabled == 'true' && steps.decide.outputs.pin == 'true'
        working-directory: cc-plugins
        env:
          GH_TOKEN: ${{ secrets.CC_PLUGINS_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          scripts/release.sh iter8 patch "Pin iter8 $VERSION."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Pin iter8 $VERSION"
          git push -u origin HEAD
          gh pr create --repo mayberuk/cc-plugins --title "Pin iter8 $VERSION" --body "Pins the iter8 plugin to release v$VERSION."
          gh pr merge --repo mayberuk/cc-plugins --auto --squash || echo "::notice::auto-merge is not enabled on cc-plugins; merge the PR by hand"
