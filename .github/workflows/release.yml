name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run setup:browsers --with-deps
      - run: bun run build
      - run: bun run check

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run release -- --tag "$TAG" --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-release
          if-no-files-found: error
          path: |
            dist/release/iter8-linux-x64
            dist/release/iter8-darwin-arm64
            dist/release/SHA256SUMS

  macos:
    needs: build
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-release
          path: dist/release
      - name: Verify macOS signature and version
        working-directory: dist/release
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          shasum -a 256 --check SHA256SUMS
          chmod +x iter8-darwin-arm64
          if codesign -vvv --verify ./iter8-darwin-arm64; then
            echo "macOS codesign: cross-compiled signature verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS codesign: cross-compiled signature failed; applying ad-hoc signature." >> "$GITHUB_STEP_SUMMARY"
            codesign --force --sign - --entitlements ../../scripts/entitlements.plist ./iter8-darwin-arm64
            codesign -vvv --verify ./iter8-darwin-arm64
            echo "macOS codesign: ad-hoc signature verified." >> "$GITHUB_STEP_SUMMARY"
          fi
          actual=$(./iter8-darwin-arm64 --version)
          expected="iter8 ${TAG#v}"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: expected '$expected', received '$actual'" >&2
            exit 1
          fi
          shasum -a 256 iter8-linux-x64 iter8-darwin-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          if-no-files-found: error
          path: |
            dist/release/iter8-linux-x64
            dist/release/iter8-darwin-arm64
            dist/release/SHA256SUMS

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: mayberuk/iter8
      TAG: ${{ github.ref_name }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist/release
      - name: Verify checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS
      # Attest after the macOS job's re-signing: an attestation binds the file digest, so only these final bytes count.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/iter8-linux-x64
            dist/release/iter8-darwin-arm64
            dist/release/SHA256SUMS
      - name: Publish release
        working-directory: dist/release
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag "${flags[@]}" iter8-linux-x64 iter8-darwin-arm64 SHA256SUMS

  pin-plugin:
    needs: publish
    runs-on: ubuntu-latest
    # GITHUB_TOKEN may open the pull request only while "Allow GitHub Actions to create and approve pull requests" is on.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide whether to pin
        id: decide
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease; skipping the plugin pin bump"
            echo "pin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(jq -er .version plugins/iter8/release.json)
          IFS=. read -ra NEW <<< "${VERSION%%+*}"
          IFS=. read -ra OLD <<< "${CURRENT%%[-+]*}"
          PIN=false
          for i in 0 1 2; do
            if (( 10#${NEW[i]} > 10#${OLD[i]} )); then PIN=true; break; fi
            if (( 10#${NEW[i]} < 10#${OLD[i]} )); then break; fi
          done
          if [ "$PIN" = false ]; then
            echo "::notice::$VERSION is not newer than the pinned $CURRENT; skipping the plugin pin bump"
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
      - name: Pin release checksums and bump the plugin version
        if: steps.decide.outputs.pin == 'true'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git switch -c "iter8-pin-$VERSION"
          plugins/iter8/scripts/pin-release.sh "$VERSION"
          MANIFEST=plugins/iter8/.claude-plugin/plugin.json
          IFS=. read -r MAJOR MINOR PATCH <<< "$(jq -er .version "$MANIFEST")"
          BUMPED=$(mktemp)
          jq --arg v "$MAJOR.$MINOR.$((PATCH + 1))" '.version = $v' "$MANIFEST" > "$BUMPED"
          mv "$BUMPED" "$MANIFEST"
      - name: Open the pin pull request
        if: steps.decide.outputs.pin == 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/iter8
          git commit -m "Pin iter8 $VERSION"
          git push -u origin HEAD
          BODY="Pins the iter8 plugin to release v$VERSION and bumps the plugin version.

          This pull request was opened with the workflow token, so GitHub does not run its checks on its own: a maintainer with write access must click \"Approve workflows to run\" (or push to the branch with a personal token) before the required checks report. Auto-merge is deliberately not enabled; merge by hand once the checks pass."
          gh pr create --base "$BASE" --title "Pin iter8 $VERSION" --body "$BODY"
