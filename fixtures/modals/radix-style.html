<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A modal that closes on an outside press and returns focus, as Radix Dialog does</title>
  <link rel="stylesheet" href="./modal.css" />
</head>
<body>
  <main id="app">
    <h1>A modal that closes on an outside press and returns focus, as Radix Dialog does</h1>
    <button type="button" id="open">Open modal</button>
    <button type="button" id="page-button">Page button</button>
  </main>
  <div id="backdrop" hidden></div>
  <div id="modal" role="dialog" aria-modal="true" aria-label="Modal" tabindex="-1" hidden>
    <h2>Modal</h2>
    <p id="modal-target">Annotate me</p>
    <input id="modal-input" aria-label="Modal field" />
    <button type="button" id="close">Close modal</button>
  </div>
  <script>
    const modal = document.getElementById("modal")
    const backdrop = document.getElementById("backdrop")
    let last = null
    window.__closedBy = []
    window.__isOpen = () => !modal.hidden
    window.__open = () => {
      modal.hidden = backdrop.hidden = false
      document.body.style.pointerEvents = "none"
      last = document.getElementById("modal-input")
      last.focus()
    }
    window.__close = () => {
      modal.hidden = backdrop.hidden = true
      document.body.style.pointerEvents = ""
    }
    document.addEventListener("pointerdown", (event) => {
      if (modal.hidden || modal.contains(event.target)) return
      window.__close()
      window.__closedBy.push("pointerdown-outside")
    })
    document.addEventListener("focusin", (event) => {
      if (modal.hidden) return
      if (modal.contains(event.target)) last = event.target
      else last.focus()
    })
    document.addEventListener("focusout", (event) => {
      if (!modal.hidden && event.relatedTarget && !modal.contains(event.relatedTarget)) last.focus()
    })
  </script>
  <script src="./common.js"></script>
</body>
</html>
